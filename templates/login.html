{% extends 'base.html' %}

{% block content %}
<h2>Login</h2>
<form method="post" class="form-card">
  <label>Email
    <input type="email" name="email" pattern="^.+@qe\.thorpeunderwood\.com$" placeholder="example@qe.thorpeunderwood.com"required>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Login</button>
</form>
{% endblock %}
